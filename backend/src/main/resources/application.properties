spring.application.name=media_controller_iot

# Every value below can be overridden with an environment variable.
# The defaults match docker-compose.yml, so the stack runs with no setup.

# --- DATABASE ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/music_box?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:musicbox}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:musicbox}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- CORS (only needed when the frontend runs on its own dev server) ---
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# --- MUSIC FOLDER ---
# Imported into the library on startup and served at /media/**. Docker mounts ./music at /music.
app.media.dir=${MUSIC_DIR:../music}

# --- AUTH ---
# HS256 signing key, at least 32 bytes. When empty a random key is used and logins reset on restart.
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl-hours=${JWT_TTL_HOURS:168}

# --- ESP32 REMOTE ---
# Shared key the remote sends in the X-Device-Key header. Empty disables the device API.
app.device.key=${DEVICE_KEY:}

# --- FILE UPLOAD ---
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# --- ACTUATOR ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
