spring.application.name=media_controller_iot

# Every value below can be overridden with an environment variable.
# The defaults run with no setup: `mvnw spring-boot:run` needs no database server.

# --- DATABASE ---
# Default: an embedded H2 database in backend/data/ (kept between restarts). docker-compose.yml
# points SPRING_DATASOURCE_URL at its MySQL container instead.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/music_box;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:musicbox}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:musicbox}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- CORS (only needed when the frontend runs on its own dev server) ---
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# --- MUSIC FOLDER ---
# Imported into the library on startup and served at /media/**. Docker mounts ./music at /music.
app.media.dir=${MUSIC_DIR:../music}

# --- ESP32 REMOTE ---
# Shared key the remote sends in the X-Device-Key header. It must match CONFIG_MUSICBOX_DEVICE_KEY
# in the firmware. Empty disables the device API.
app.device.key=${DEVICE_KEY:musicbox-demo-key}

# --- FILE UPLOAD ---
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# --- ACTUATOR ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
