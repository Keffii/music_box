spring.application.name=media_controller_iot

# Every value below can be overridden with an environment variable.
# On AWS they are set under Elastic Beanstalk > Configuration > Updates, monitoring and logging
# > Environment properties. See docs/DEPLOY_AWS.md. Never put real secrets in this file.

# --- SERVER ---
# Elastic Beanstalk's nginx forwards to port 5000
server.port=${SERVER_PORT:8080}

# --- DATABASE (RDS MySQL) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/music_box?serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Off: otherwise each live player stream (/api/player/stream, open for as long as a tab is open) keeps
# a database connection reserved, and with one stream per visitor the 10-connection pool runs out
spring.jpa.open-in-view=false

# --- CORS ---
# Comma-separated origin patterns, e.g. https://main.d1abc2def3.amplifyapp.com
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,https://*.amplifyapp.com}

# --- AWS S3 ---
# Leave the keys empty on AWS: the app then uses the Elastic Beanstalk instance role.
# Only set them for running the backend on your own PC.
aws.accessKeyId=${AWS_ACCESS_KEY_ID:}
aws.secretKey=${AWS_SECRET_ACCESS_KEY:}
aws.region=${AWS_REGION:eu-north-1}
aws.s3.bucket=${AWS_S3_BUCKET:music-box-files}

# Import songs from the bucket's music/ and cover/ folders on startup (see SongLibrarySeeder)
app.seed-from-s3=${SEED_FROM_S3:true}

# --- FILE UPLOAD ---
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# --- AWS COGNITO ---
aws.cognito.region=${AWS_COGNITO_REGION:eu-north-1}
aws.cognito.userPoolId=${AWS_COGNITO_USER_POOL_ID:}
aws.cognito.appClientId=${AWS_COGNITO_APP_CLIENT_ID:}

# --- ESP32 BLUETOOTH REMOTE ---
# Only works when the backend runs on the PC paired with the ESP32. Set SERIAL_ENABLED=false on AWS.
serial.enabled=${SERIAL_ENABLED:true}
# Cognito user ID ("sub") whose player the remote controls. Empty: a separate "remote" player.
app.remote-user-id=${REMOTE_USER_ID:}
serial.port=${SERIAL_PORT:COM6}

# --- ACTUATOR ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
