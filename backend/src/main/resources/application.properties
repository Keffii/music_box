spring.application.name=media_controller_iot

# Every value below can be overridden with an environment variable.
# The defaults match docker-compose.yml, so the stack runs with no setup.

# --- DATABASE ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/music_box?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:musicbox}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:musicbox}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- CORS (only needed when the frontend runs on its own dev server) ---
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# --- AWS (removed in a later commit) ---
aws.accessKeyId=${AWS_ACCESS_KEY_ID:unused}
aws.secretKey=${AWS_SECRET_ACCESS_KEY:unused}
aws.region=${AWS_REGION:eu-central-1}
aws.s3.bucket=${AWS_S3_BUCKET:unused}
aws.cognito.region=${AWS_COGNITO_REGION:eu-central-1}
aws.cognito.userPoolId=${AWS_COGNITO_USER_POOL_ID:unused}

# --- FILE UPLOAD ---
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# --- ACTUATOR ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
