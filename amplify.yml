# AWS Amplify build settings. In Amplify, choose "My app is a monorepo" with root "frontend".
# Environment variables (REACT_APP_*) are set in the Amplify console; see docs/DEPLOY_AWS.md.
version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 20
            - nvm use 20
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: build
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
