# Music Box: run everything locally with `docker compose up --build`.
# Every value has a working default. Override any of them in a .env file next to
# this one (see .env.example).
#
#   Web player:  http://localhost:8080
#   ESP32 API:   http://<this computer's LAN IP>:8080/api/device/...

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-musicbox-root}
      MYSQL_DATABASE: music_box
      MYSQL_USER: ${MYSQL_USER:-musicbox}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-musicbox}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/music_box?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-musicbox}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-musicbox}
      MUSIC_DIR: /music
      # Shared key for the ESP32 remote. It must match CONFIG_MUSICBOX_DEVICE_KEY in the firmware.
      DEVICE_KEY: ${DEVICE_KEY:-musicbox-demo-key}
      # Optional, at least 32 characters. Without it, logins reset when the backend restarts.
      JWT_SECRET: ${JWT_SECRET:-}
    volumes:
      - ./music:/music
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"

volumes:
  mysql_data:
